content:
  set_build_variables: false
  source:
    path: images
    dockerfile: openshift-golang-builder.Dockerfile
    git:
      branch:
        target: rhel-8-golang-1.17-go-wrapper
      url: git@github.com:jupierce/ocp-build-data.git
enabled_repos:
- rhel-8-server-ose-build-rpms
# for clang
- rhel-8-appstream-rpms
# for newer golang
- rhel-8-newer-golang-rpms

from:
  stream: rhel8

labels:
  io.k8s.description: golang builder image for Red Hat internal builds

name: openshift/golang-builder

owners:
- aos-team-art@redhat.com

# DO NOT BUILD TEST BUILDS INTO THESE TAGS. CPAAS CONSUMES THEM.
#additional_tags:
#- 'rhel_8_golang_1.19'
#- 'rhel_8_1.19'

maintainer:
  component: Release
